[project]
name = "oop-medical-image-pipeline"
version = "0.1.0"
description = "Modular ETL pipeline for medical imaging datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.0.0",
    "pillow>=12.1.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
pipeline = "cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
    "pre-commit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/pipeline", "src/data_import"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/pipeline", "src/cli", "src/data_import"]
omit = ["*/tests/*"]

[tool.coverage.report]
omit = ["*/tests/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.1",
]
